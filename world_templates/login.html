<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER POS - 認証ログイン</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-blue-400 mb-1">⚡ SUPER POS 認証</h2>
        <p class="text-xs text-gray-400 text-center mb-6">店員IDとPINコードを入力してください</p>

        <!-- Flash メッセージ表示エリア -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 mb-4 text-xs rounded border font-bold {% if category == 'danger' %}bg-rose-900/50 text-rose-300 border-rose-700{% elif category == 'success' %}bg-emerald-900/50 text-emerald-300 border-emerald-700{% else %}bg-amber-900/50 text-amber-300 border-amber-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/login" method="POST" class="space-y-4 text-sm">
            <div>
                <label class="block mb-1 font-bold">店員ID</label>
                <input type="text" name="staff_id" required placeholder="例: 1001" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <div>
                <label class="block mb-1 font-bold">店員PIN (4桁暗証番号)</label>
                <input type="password" name="pin" maxlength="4" required placeholder="••••" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-blue-500">
            </div>

            <!-- オプション / ネタ要素設定 -->
            <div class="p-3 bg-slate-900/80 rounded border border-slate-700 space-y-2 text-xs">
                <span class="font-bold text-amber-400 block mb-1">🛡️ システム環境・各種フィルター設定</span>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" name="loylo_bypass" class="rounded text-blue-600" checked>
                    <span>ロイロWebフィルター警告回避プロキシ</span>
                </label>
                <label class="flex items-center space-x-2 cursor-pointer">
                    <input type="checkbox" name="stealth_mode" class="rounded text-blue-600">
                    <span>授業中隠れレジ打ち（無音＆高速画面偽装）</span>
                </label>
            </div>

            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-2.5 rounded font-bold transition">ログイン</button>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4">
            <a href="/register" class="text-xs text-blue-400 hover:underline">新規アカウント作成（店員登録）</a>
        </div>
    </div>
</body>
</html>
