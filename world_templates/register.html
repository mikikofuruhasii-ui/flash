<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SUPER POS - アカウント作成</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-gray-100 flex items-center justify-center min-h-screen p-4">
    <div class="bg-slate-800 p-8 rounded-xl shadow-2xl w-full max-w-md border border-slate-700">
        <h2 class="text-2xl font-bold text-center text-emerald-400 mb-1">👤 店員アカウント作成</h2>
        <p class="text-xs text-gray-400 text-center mb-6">新規スタッフ情報を登録します</p>

        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="p-3 mb-4 text-xs rounded border font-bold {% if category == 'danger' %}bg-rose-900/50 text-rose-300 border-rose-700{% else %}bg-amber-900/50 text-amber-300 border-amber-700{% endif %}">
                {{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <form action="/register" method="POST" class="space-y-4 text-sm">
            <div>
                <label class="block mb-1 font-bold">店員ID</label>
                <input type="text" name="staff_id" required placeholder="例: 1002" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block mb-1 font-bold">ユーザー名 (表示名)</label>
                <input type="text" name="username" required placeholder="例: 山田太郎" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <div>
                <label class="block mb-1 font-bold">店員PIN (4桁暗証番号)</label>
                <input type="password" name="pin" maxlength="4" required placeholder="••••" class="w-full p-2.5 rounded bg-slate-700 border border-slate-600 focus:outline-none focus:ring-2 focus:ring-emerald-500">
            </div>

            <button type="submit" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded font-bold transition">アカウントを作成して登録</button>
        </form>

        <div class="mt-6 text-center border-t border-slate-700 pt-4">
            <a href="/login" class="text-xs text-gray-400 hover:underline">← ログイン画面に戻る</a>
        </div>
    </div>
</body>
</html>
